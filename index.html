<style>
/* Layout: 입력 → 채팅 상담(3문답) → 긴 심화분석 리포트(상단 목차, 하단 질문창). 먹색 바탕에 청자빛 포인트, 오행 5색으로 글자 구분 */

  --wx0:#5FCB8C; --wx1:#FF7B7F; --wx2:#E3B84F; --wx3:#B7C2CF; --wx4:#6FA8F0;
  --g2:#5FD39B; --g2b:#133A2A; --g1:#7CCB9F; --g1b:#15301F; --g0:#A3AFBE; --g0b:#222E3D; --b1:#F0A15A; --b1b:#3B2A17; --b2:#FF8A80; --b2b:#40201F;

*{box-sizing:border-box}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>

/* ---- core.js ---- */
/* ===== core.js : 천문 계산 · 만세력 · 대운/세운/월운 ===== */
var TG = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var TGK = ['갑','을','병','정','무','기','경','신','임','계'];
var DZ = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var DZK = ['자','축','인','묘','진','사','오','미','신','유','술','해'];
var WXN = ['목','화','토','금','수'];
var WXH = ['木','火','土','金','水'];
var WX_TG = [0,0,1,1,2,2,3,3,4,4];
var WX_DZ = [4,2,0,0,2,1,1,2,3,3,2,4];
var ANIMAL = ['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
/* 지장간 : 여기 → 중기 → 정기 순서 [천간idx, 일수] */
var JJG = [
  [[8,10],[9,20]],
  [[9,9],[7,3],[5,18]],
  [[4,7],[2,7],[0,16]],
  [[0,10],[1,20]],
  [[1,9],[9,3],[4,18]],
  [[4,7],[6,7],[2,16]],
  [[2,10],[5,9],[3,11]],
  [[3,9],[1,3],[5,18]],
  [[4,7],[8,7],[6,16]],
  [[6,10],[7,20]],
  [[7,9],[3,3],[4,18]],
  [[4,7],[0,7],[8,16]]
];
function jjgMain(z){ var a=JJG[z]; return a[a.length-1][0]; }

var JEOL_NAMES = {315:'입춘',345:'경칩',15:'청명',45:'입하',75:'망종',105:'소서',135:'입추',165:'백로',195:'한로',225:'입동',255:'대설',285:'소한'};
var TERM24 = ['입춘','우수','경칩','춘분','청명','곡우','입하','소만','망종','하지','소서','대서','입추','처서','백로','추분','한로','상강','입동','소설','대설','동지','소한','대한'];

function mod(a,n){ return ((a%n)+n)%n; }
function rad(d){ return d*Math.PI/180; }

function jdFromYMDHMS(y,m,d,h,mi,s){
  var a=Math.floor((14-m)/12), y2=y+4800-a, m2=m+12*a-3;
  var jdn=d+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)-Math.floor(y2/100)+Math.floor(y2/400)-32045;
  return jdn-0.5+(h+mi/60+(s||0)/3600)/24;
}
function ymdFromJD(jd){ /* returns UTC components */
  var z=Math.floor(jd+0.5), f=jd+0.5-z, a=z;
  if(z>=2299161){ var al=Math.floor((z-1867216.25)/36524.25); a=z+1+al-Math.floor(al/4); }
  var b=a+1524, c=Math.floor((b-122.1)/365.25), d=Math.floor(365.25*c), e=Math.floor((b-d)/30.6001);
  var day=b-d-Math.floor(30.6001*e), month=e<14?e-1:e-13, year=month>2?c-4716:c-4715;
  var secs=Math.round(f*86400), hh=Math.floor(secs/3600), mm=Math.floor((secs%3600)/60), ss=secs%60;
  if(hh>=24){ hh=0; }
  return {y:year,m:month,d:day,h:hh,mi:mm,s:ss};
}
/* ΔT (초) : Espenak & Meeus */
function deltaT(y){
  var t;
  if(y<1920){ t=y-1900; return -2.79+1.494119*t-0.0598939*t*t+0.0061966*t*t*t-0.000197*t*t*t*t; }
  if(y<1941){ t=y-1920; return 21.20+0.84493*t-0.076100*t*t+0.0020936*t*t*t; }
  if(y<1961){ t=y-1950; return 29.07+0.407*t-t*t/233+t*t*t/2547; }
  if(y<1986){ t=y-1975; return 45.45+1.067*t-t*t/260-t*t*t/718; }
  if(y<2005){ t=y-2000; return 63.86+0.3345*t-0.060374*t*t+0.0017275*t*t*t+0.000651814*t*t*t*t+0.00002373599*t*t*t*t*t; }
  if(y<2050){ t=y-2000; return 62.92+0.32217*t+0.005589*t*t; }
  if(y<2150){ return -20+32*Math.pow((y-1820)/100,2)-0.5628*(2150-y); }
  return 69;
}
/* 태양 겉보기 황경 (도). jde = 역학시(TT) 율리우스일 */
function sunLonBase(jde){
  var T=(jde-2451545)/36525;
  var L0=280.46646+36000.76983*T+0.0003032*T*T;
  var M=357.52911+35999.05029*T-0.0001537*T*T;
  var Mr=rad(M);
  var C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(Mr)+(0.019993-0.000101*T)*Math.sin(2*Mr)+0.000289*Math.sin(3*Mr);
  var om=125.04-1934.136*T;
  return mod(L0+C-0.00569-0.00478*Math.sin(rad(om)),360);
}
function sunLonTT(jde){
  var T=(jde-2451545)/36525;
  var lam=sunLonBase(jde);
  var lr=rad(lam);
  /* 정밀 춘분·하지·추분·동지 공식(Meeus 27장)에 맞춰 최소제곱으로 구한 보정항 */
  var corr=-0.002107-0.00002*Math.cos(lr)+0.000209*Math.sin(lr)-0.000764*T
    +(-0.001276*Math.cos(rad(153.23+22518.7541*T))+0.000421*Math.sin(rad(153.23+22518.7541*T)))
    +( 0.001232*Math.cos(rad(216.57+45037.5082*T))-0.000915*Math.sin(rad(216.57+45037.5082*T)))
    +(-0.001779*Math.cos(rad(312.69+32964.3577*T))+0.000843*Math.sin(rad(312.69+32964.3577*T)))
    +( 0.000002*Math.cos(rad(297.85+445267.1115*T))+0.001792*Math.sin(rad(297.85+445267.1115*T)))
    +( 0.000498*Math.cos(rad(353.40+65928.7155*T))-0.000581*Math.sin(rad(353.40+65928.7155*T)));
  return mod(lam+corr,360);
}
function sunLonUT(jdUT,y){ return sunLonTT(jdUT+deltaT(y)/86400); }

/* 목표 황경(lonT)에 이르는 UT 율리우스일 (guess 부근) */
function solveSunLon(lonT, guessJD, yHint){
  var jd=guessJD;
  for(var i=0;i<12;i++){
    var l=sunLonUT(jd,yHint);
    var d=mod(lonT-l+180,360)-180;
    jd+=d/0.9856474;
    if(Math.abs(d)<1e-7) break;
  }
  return jd;
}
/* y년의 절/기 (입춘=315° 부터) */
function termTime(y, lon){
  var base=jdFromYMDHMS(y,2,4,0,0,0);
  var off=mod(lon-315,360)/360*365.2422;
  return solveSunLon(lon, base+off, y);
}
function jdToKST(jd){ return ymdFromJD(jd+9/24); }
function fmtKST(jd){ var o=jdToKST(jd); return o.y+'.'+p2(o.m)+'.'+p2(o.d)+' '+p2(o.h)+':'+p2(o.mi); }
function p2(n){ return (n<10?'0':'')+n; }

/* ===== 한국 표준시 이력 ===== */
function cmpDate(y,m,d,y2,m2,d2){ return (y*10000+m*100+d)-(y2*10000+m2*100+d2); }
var KR_DST = [
  [1948,6,1,1948,9,13],[1949,4,3,1949,9,11],[1950,4,1,1950,9,10],[1951,5,6,1951,9,9],
  [1955,5,5,1955,9,9],[1956,5,20,1956,9,30],[1957,5,5,1957,9,22],[1958,5,4,1958,9,21],
  [1959,5,3,1959,9,20],[1960,5,1,1960,9,18],[1987,5,10,1987,10,11],[1988,5,8,1988,10,9]
];
function krLegalOffsetMin(y,m,d,useDST){
  var base;
  if(cmpDate(y,m,d,1908,4,1)<0) base=508;
  else if(cmpDate(y,m,d,1912,1,1)<0) base=510;
  else if(cmpDate(y,m,d,1954,3,21)<0) base=540;
  else if(cmpDate(y,m,d,1961,8,10)<0) base=510;
  else base=540;
  var dst=false;
  if(useDST){
    for(var i=0;i<KR_DST.length;i++){
      var r=KR_DST[i];
      if(cmpDate(y,m,d,r[0],r[1],r[2])>=0 && cmpDate(y,m,d,r[3],r[4],r[5])<=0){ dst=true; break; }
    }
  }
  return {base:base, dst:dst, total:base+(dst?60:0)};
}
/* 균시차(분) */
function equationOfTimeMin(jdUT){
  var T=(jdUT-2451545)/36525;
  var L0=mod(280.46646+36000.76983*T,360), M=mod(357.52911+35999.05029*T,360);
  var e=0.016708634-0.000042037*T;
  var eps=23.439291-0.0130042*T;
  var y=Math.pow(Math.tan(rad(eps/2)),2);
  var l0=rad(L0), m=rad(M);
  var E=y*Math.sin(2*l0)-2*e*Math.sin(m)+4*e*y*Math.sin(m)*Math.cos(2*l0)-0.5*y*y*Math.sin(4*l0)-1.25*e*e*Math.sin(2*m);
  return E*180/Math.PI*4;
}

/* ===== 사주 산출 ===== */
function dayIndexFromYMD(y,m,d){
  var a=Math.floor((14-m)/12), y2=y+4800-a, m2=m+12*a-3;
  var jdn=d+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)-Math.floor(y2/100)+Math.floor(y2/400)-32045;
  return mod(jdn+49,60);
}
function addDays(y,m,d,n){
  var jd=jdFromYMDHMS(y,m,d,12,0,0)+n; var o=ymdFromJD(jd); return {y:o.y,m:o.m,d:o.d};
}
function ganzhi(idx){ return {g:idx%10, z:idx%12, idx:idx}; }
function gzName(idx){ return TG[idx%10]+DZ[idx%12]; }
function gzKor(idx){ return TGK[idx%10]+DZK[idx%12]; }
function gzFromGZ(g,z){ for(var i=0;i<60;i++){ if(i%10===g&&i%12===z) return i; } return -1; }

/*
 input: {name, gender:'M'|'F', y,m,d,h,mi, lon, utcOffsetMin(optional manual), place, correction:'none'|'lon'|'lon_eot', dayChange:'zero'|'23', dst:true}
*/
function computeSaju(inp){
  var opt=inp;
  var legal, offsetMin;
  if(opt.manualOffset!=null){ offsetMin=opt.manualOffset; legal={base:offsetMin,dst:false,total:offsetMin}; }
  else { legal=krLegalOffsetMin(opt.y,opt.m,opt.d,opt.dst!==false); offsetMin=legal.total; }
  var jdLocalClock=jdFromYMDHMS(opt.y,opt.m,opt.d,opt.h,opt.mi,0);
  var jdUT=jdLocalClock-offsetMin/1440;                 /* 실제 순간 (UT) */
  var lon=opt.lon!=null?opt.lon:126.98;
  var corrMin=0, corrDetail={};
  if(opt.correction!=='none'){
    var stdMer=(legal.base)/4;   /* 법정 표준시가 기준한 경도 */
    corrMin=(lon-stdMer)*4;
    corrDetail.lonMin=corrMin;
    if(opt.correction==='lon_eot'){ var e=equationOfTimeMin(jdUT); corrMin+=e; corrDetail.eotMin=e; }
    if(legal.dst){ corrMin-=60; corrDetail.dstMin=-60; }
  } else {
    if(legal.dst){ corrMin=-60; corrDetail.dstMin=-60; }
  }
  var jdSolar=jdLocalClock+corrMin/1440;                  /* 일·시주 판단용 시각 */
  var s=ymdFromJD(jdSolar);                               /* "벽시계 형태"의 보정 시각 */

  /* 일주 */
  var dy=s.y, dm=s.m, dd=s.d, hourDec=s.h+s.mi/60;
  var dayShift=0;
  if(opt.dayChange==='23' && hourDec>=23){ dayShift=1; }
  var dd2=addDays(dy,dm,dd,dayShift);
  var dayIdx=dayIndexFromYMD(dd2.y,dd2.m,dd2.d);
  /* 시주 */
  var hZ=Math.floor(mod(hourDec+1,24)/2);
  var hG=mod((mod(dayIdx%10,5))*2+hZ,10);
  /* 연주·월주 (절기 기준: 실제 순간 jdUT) */
  var lam=sunLonUT(jdUT,s.y);
  var mIdx=Math.floor(mod(lam-315,360)/30);   /* 0=寅 */
  var yInfo=ymdFromJD(jdUT+9/24);
  var sajuYear=yInfo.y;
  var ipchunThis=termTime(sajuYear,315);
  if(jdUT<ipchunThis) sajuYear-=1;
  var yIdx=mod(sajuYear-4,60);
  var yG=yIdx%10, yZ=yIdx%12;
  var mStart=[2,4,6,8,0][yG%5];   /* 寅月 천간: 甲己→丙 乙庚→戊 丙辛→庚 丁壬→壬 戊癸→甲 */
  var mG=(mStart+mIdx)%10, mZ=(2+mIdx)%12;
  var mIdxGZ=gzFromGZ(mG,mZ);
  var hIdxGZ=gzFromGZ(hG,hZ);

  var prevLon=mod(315+mIdx*30,360), nextLon=mod(prevLon+30,360);
  var prevJD=solveSunLon(prevLon, jdUT-mod(lam-prevLon,360)/0.9856474, s.y);
  var nextJD=solveSunLon(nextLon, jdUT+mod(nextLon-lam,360)/0.9856474, s.y);
  var nearestMin=Math.min(Math.abs(jdUT-prevJD),Math.abs(nextJD-jdUT))*1440;

  var res={
    input:opt, legal:legal, offsetMin:offsetMin, corrMin:corrMin, corrDetail:corrDetail,
    jdUT:jdUT, solar:s, sajuYear:sajuYear, sunLon:lam,
    pillars:[ganzhi(yIdx),ganzhi(mIdxGZ),ganzhi(dayIdx),ganzhi(hIdxGZ)],
    dayShift:dayShift,
    prevJeolJD:prevJD, nextJeolJD:nextJD, prevJeolName:JEOL_NAMES[prevLon], nextJeolName:JEOL_NAMES[nextLon],
    nearBoundaryMin:nearestMin, mIdx:mIdx
  };
  res.dm=dayIdx%10;
  res.gender=opt.gender;
  return res;
}

/* ===== 대운 ===== */
function computeDaewoon(sj){
  var yangYear = (sj.pillars[0].g%2===0);
  var male = sj.gender==='M';
  var forward = (yangYear&&male)||(!yangYear&&!male);
  var diffDays = forward ? (sj.nextJeolJD-sj.jdUT) : (sj.jdUT-sj.prevJeolJD);
  var yearsExact = diffDays/3;
  var n = Math.max(1, Math.round(yearsExact));
  var list=[]; var mi=sj.pillars[1].idx;
  for(var k=1;k<=10;k++){
    var idx=mod(mi+(forward?k:-k),60);
    var startYears=yearsExact+(k-1)*10;
    var startJD=sj.jdUT+startYears*365.2422;
    var sd=jdToKST(startJD);
    list.push({k:k, idx:idx, startAge:startYears, endAge:startYears+10, startJD:startJD, startYear:sd.y, startDate:sd, daewoonNum:n+(k-1)*10});
  }
  return {forward:forward, diffDays:diffDays, yearsExact:yearsExact, num:n, list:list, yangYear:yangYear};
}
function daewoonAt(dw, jdNow){
  var cur=null;
  for(var i=0;i<dw.list.length;i++){
    var a=dw.list[i].startJD, b=a+10*365.2422;
    if(jdNow>=a && jdNow<b){ cur=dw.list[i]; break; }
  }
  return cur;
}
/* ===== 세운 / 월운 ===== */
function seunIdx(y){ return mod(y-4,60); }
function wolunList(y){
  var yIdx=seunIdx(y), yG=yIdx%10;
  var mStart=[2,4,6,8,0][yG%5];
  var out=[];
  for(var i=0;i<12;i++){
    var lon=mod(315+i*30,360);
    var jd=termTime(y,lon);
    var idx=gzFromGZ((mStart+i)%10,(2+i)%12);
    out.push({i:i, idx:idx, startJD:jd, name:JEOL_NAMES[lon], monthNo:mod(i+1,12)===0?12:((i+1))});
  }

/* ===== 용신 ===== */
function seasonScore(mz){ return [-3,-2.5,-1,0,0.3,2,3,2.5,0.3,-0.3,-0.2,-2][mz]; }

    else { main=bi; reason='신약하고 재성·식상으로 힘이 빠지는 구조라 비겁으로 일간을 도와 재를 감당하는 것이 필요합니다.'; }

}
var ROLE_SCORE={'용신':3,'희신':1.6,'한신':0,'구신':-1.5,'기신':-3};

/* ===== 운(대운·세운·월운) 평가 ===== */
var REL_BASE={'충':-1.0,'형':-0.8,'파':-0.4,'해':-0.5,'원진':-0.5,'귀문':-0.3,'자형':-0.5,'육합':0.5,'삼합':0.8,'반합':0.4,'방합':0.6,'삼형':-1.2,'천간합':0.3,'천간충':-0.8};

}

function dmOf(c){ return c.pillars[2].g; }
function ssz(c,z){ return sipsungZ(dmOf(c),z); }
function ssg(c,g){ return sipsung(dmOf(c),g); }
function spouseGroup(c){ return c.gender==='M'?[4,5]:[6,7]; }
function countSS(c,list){ var n=0; list.forEach(function(i){ n+=c.ssCount[i]; }); return n; }
function posOfSS(c,idxList){  /* 십성이 있는 위치 문자열 */
  var dm=dmOf(c), out=[];
  c.pillars.forEach(function(p,i){
    if(i!==2 && idxList.indexOf(sipsung(dm,p.g))>=0) out.push(GUNG_GAN[i]+'('+TG[p.g]+SS[sipsung(dm,p.g)]+')');
    if(idxList.indexOf(sipsungZ(dm,p.z))>=0) out.push(GUNG_ZI[i]+'('+DZ[p.z]+SS[sipsungZ(dm,p.z)]+')');
  });
  return out;
}
function nowCtx(c,nowJD){
  var sy=sajuYearAt(nowJD);
  var dwCur=daewoonAt(c.dw,nowJD);
  return {sy:sy,dw:dwCur,
    rDW:dwCur?evalLuck(c,c,dwCur.idx,'대운'):null,
    rSY:evalLuck(c,c,seunIdx(sy),'세운'),
    rSY1:evalLuck(c,c,seunIdx(sy+1),'세운'),
    idxSY:seunIdx(sy), idxSY1:seunIdx(sy+1)};
}
function ageAt(c,jd){ return (jd-c.jdUT)/365.2422; }

/* ----- 관계 문장 ----- */
var BAD_REL=['충','형','삼형','파','해','원진','귀문','자형'];
function relSentence(c,e,label){
  var dm=dmOf(c), lz=e.lz;
  if(e.type==='삼형'){
    return label+'의 '+DZ[lz]+'가 원국의 두 글자와 만나 삼형('+e.name+')을 이룹니다. '+REL_TEXT['삼형']+'. 특히 법적 시비·계약 분쟁·수술·교통사고처럼 날카로운 일에 대비하고, 무리한 결정을 피하는 것이 좋습니다.';
  }
  if(e.type==='삼합'||e.type==='방합'||e.type==='반합'){
    var role=roleOfEl(c,e.wx);
    var tail=(role==='용신'||role==='희신')?'모이는 오행이 '+role+'이라 도움이 되는 방향으로 힘이 커집니다.':(role==='기신'||role==='구신')?'모이는 오행이 '+role+'이라 부담스러운 기운이 오히려 커질 수 있어 주의가 필요합니다.':'모이는 오행이 한신이라 영향은 크지 않습니다.';
    return label+'의 '+DZ[lz]+'가 원국과 '+e.name+'을(를) 이룹니다. '+REL_TEXT[e.type]+'. '+tail;
  }
  var zn=e.zn, gi=GUNG_INFO[e.gung];
  var nSS=SS[ssz(c,zn)], lSS=SS[ssz(c,lz)];
  var natalRole=roleOfEl(c,WX_DZ[zn]);
  var s=label+'의 '+DZ[lz]+'('+lSS+')가 '+GUNG_ZI[e.gung]+' '+DZ[zn]+'('+nSS+')와 '+TERM_NAME[e.type]+'을(를) 이룹니다. '+REL_TEXT[e.type]+'. ';
  s+=GUNG_INFO[e.gung].n+'는 '+gi.ev+'을(를) 뜻하고, '+nSS+'('+SS_INFO[ssz(c,zn)].key.split('·')[0]+' 계열)이 걸린 자리라 해당 영역에서 나타나기 쉽습니다. ';
  if(BAD_REL.indexOf(e.type)>=0){
    if(natalRole==='용신'||natalRole==='희신') s+='흔들리는 자리가 도움이 되는 기운('+natalRole+')이라 손실이 큰 편입니다.';
    else if(natalRole==='기신'||natalRole==='구신') s+='흔들리는 자리가 부담스러운 기운('+natalRole+')이라 변화 속에서 오히려 정리되는 면도 있습니다.';
  } else {
    if(natalRole==='용신'||natalRole==='희신') s+='도움이 되는 기운('+natalRole+')이 이어져 유리합니다.';
    else if(natalRole==='기신'||natalRole==='구신') s+='부담스러운 기운('+natalRole+')도 함께 강해질 수 있어 과해지지 않게 조절이 필요합니다.';
  }
  return s;
}
function ganRelSentence(c,e,label){
  var g=TG[e.g], lg=TG[e.lg];
  if(e.type==='천간합'){ return label+'의 천간 '+lg+'가 '+GUNG_GAN[e.gung]+' '+g+'와 합합니다(합화 '+WXH[e.wx]+'). '+SS[ssg(c,e.lg)]+'과 '+SS[ssg(c,e.g)]+'이 묶여 관련 일이 얽히거나 인연으로 이어지기 쉽고, 합이 되는 동안 각자의 본래 작용은 약해질 수 있습니다.'; }
  return label+'의 천간 '+lg+'가 '+GUNG_GAN[e.gung]+' '+g+'와 충합니다. '+SS[ssg(c,e.lg)]+'이 '+SS[ssg(c,e.g)]+'을(를) 극하는 구조라 관련 계획·생각에 충돌과 변동이 생기기 쉽습니다.';
}
/* 사건사고 요약 */
function incidentNotes(c,r,label){
  var notes=[], bad=r.rel.filter(function(e){ return BAD_REL.indexOf(e.type)>=0 && e.gung!=null; });
  var byG={};
  bad.forEach(function(e){ (byG[e.gung]=byG[e.gung]||[]).push(e.type); });
  Object.keys(byG).forEach(function(k){
    var g=+k, ts=byG[k];
    var txt={0:'거주지·이동·외부 환경 변화, 조상·친척 문제',1:'직장·직위 변동, 부모형제 문제, 사회적 시비',2:'본인 건강, 배우자·가정 갈등(이사·별거 등 변화)',3:'자녀·아랫사람 문제, 계획 변경, 노후·건강 점검'}[g];
    notes.push(GUNG_INFO[g].n+'('+DZ[c.pillars[g].z]+')에 '+ts.filter(function(v,i,a){return a.indexOf(v)===i;}).join('·')+' → '+txt+'에서 변동이 예상됩니다.');
  });
  var danger=r.tags.filter(function(t){ return ['양인','백호','괴강'].indexOf(t)>=0; });
  if(danger.length && bad.length) notes.push(danger.join('·')+'의 날카로운 기운에 충·형이 겹쳐 사고·수술·급변에 각별히 주의해야 합니다(운전·무리한 운동·공사 현장 등).');
  else if(danger.length) notes.push(danger.join('·')+'의 기운이 들어와 기세가 강해지니 말과 행동이 거칠어지지 않게 조심하세요.');
  if(r.tags.indexOf('천을귀인')>=0) notes.push('천을귀인이 들어와 어려움이 닥쳐도 도와줄 사람이 나타날 가능성이 큽니다.');
  if(r.tags.some(function(t){return t.indexOf('역마')>=0;})) notes.push('역마 기운이 있어 이동·출장·이사·해외 일이 생기기 쉽습니다.');
  if(r.tags.some(function(t){return t.indexOf('도화')>=0;})) notes.push('도화 기운이 있어 인기와 이성 인연이 늘지만 구설도 함께 따릅니다.');
  if(r.tags.some(function(t){return t.indexOf('화개')>=0;})) notes.push('화개 기운이 있어 공부·정리·종교·예술 쪽으로 마음이 향합니다.');
  if(r.gmHit) notes.push('운의 지지가 원국 공망('+c.gm.map(function(z){return DZ[z];}).join('')+')에 해당해 이 해의 결과가 늦게 나타나거나 기대보다 약할 수 있습니다.');
  return notes;
}
/* 운 해설 */
function luckAnalysis(c,idx,kind,label){
  var r=evalLuck(c,c,idx,kind), dm=dmOf(c);
  var g=idx%10, z=idx%12;
  var easy=[], term=[];
  var s1=SS_LUCK[r.ssg][0], s2=SS_LUCK[r.ssz][0];
  easy.push('<b>'+label+' '+fz(idx)+'</b>은 '+gSpan(r.grade)+' 흐름입니다. 겉으로 드러나는 기운(천간 '+TG[g]+')은 <b>'+SS[r.ssg]+'</b>, 실제 생활에 깊이 작용하는 기운(지지 '+DZ[z]+')은 <b>'+SS[r.ssz]+'</b>입니다. '+s1.replace(/입니다\.$/,'입니다.')+' 속으로는 '+s2);
  easy.push('이 사주에서 천간 오행 '+WXH[WX_TG[g]]+'은 <b>'+r.roleG+'</b>, 지지 오행 '+WXH[WX_DZ[z]]+'은 <b>'+r.roleZ+'</b>에 해당합니다. '+(r.score>=1?'도움이 되는 기운이 들어오는 시기라 노력의 성과가 비교적 잘 드러납니다.':r.score<=-1?'부담이 되는 기운이 들어오는 시기라 무리하지 말고 방어적으로 운영하는 편이 안전합니다.':'크게 좋지도 나쁘지도 않아 하기에 따라 결과가 갈리는 시기입니다.'));
  var evs=r.rel.map(function(e){ return relSentence(c,e,label); });
  var gev=r.grel.map(function(e){ return ganRelSentence(c,e,label); });
  if(evs.length||gev.length){ easy.push('<b>원국과의 상호작용</b><br>'+evs.concat(gev).map(function(t){return '· '+t;}).join('<br>')); }
  var inc=incidentNotes(c,r,label);
  if(inc.length) easy.push('<b>사건·사고 및 생활 변화</b><br>'+inc.map(function(t){return '· '+t;}).join('<br>'));
  term.push('천간 '+TG[g]+' = '+SS[r.ssg]+' / 지지 '+DZ[z]+' = '+SS[r.ssz]+'(정기 '+TG[jjgMain(z)]+') / 일간 기준 12운성 '+UN_NAMES[r.un]+'('+UN_TEXT[UN_NAMES[r.un]]+')');
  term.push('오행 역할: 천간 '+WXH[WX_TG[g]]+' '+r.roleG+', 지지 '+WXH[WX_DZ[z]]+' '+r.roleZ+' → 종합 점수 '+r.score.toFixed(1)+' ('+r.grade+')');
  if(r.rel.length) term.push('지지 관계: '+r.rel.map(function(e){ return e.type+(e.gung!=null?'('+GUNG_ZI[e.gung]+' '+DZ[e.zn]+')':'('+e.name+')'); }).join(', '));
  if(r.grel.length) term.push('천간 관계: '+r.grel.map(function(e){ return e.type+'('+GUNG_GAN[e.gung]+' '+TG[e.g]+')'; }).join(', '));
  term.push('공망: '+(r.gmHit?'해당('+DZ[z]+')':'해당 없음')+' / 신살: '+(r.tags.length?r.tags.join(', '):'특이 신살 없음'));
  return {r:r,easy:easy,term:term};
}

/* ===== 질문 분석 ===== */
function topicOf(q){ return detectTopic(q); }
function keyList(c,t){
  if(t.key==='spouse') return spouseGroup(c);
  return t.key;
}
function hasKey(r,keys){ return keys.indexOf(r.ssg)>=0||keys.indexOf(r.ssz)>=0; }
/* 원국 기준 주제 상태 : {txt, score, term[]} */
function natalTopic(c,t){
  var st=c.strength, dm=dmOf(c), sc=0, easy='', term=[];
  var cnt=c.ssCount;
  var weakish=st.key<=2, strongish=st.key>=4;
  function pos(list){ var p=posOfSS(c,list); return p.length?p.join(', '):'없음'; }
  if(t.id==='money'){
    var jae=cnt[4]+cnt[5], sik=cnt[2]+cnt[3], bi=cnt[0]+cnt[1];
    term.push('재성 위치: '+pos([4,5])+' / 식상 '+sik+' / 비겁 '+bi+' / 일간 '+st.level);
    if(jae===0){ easy='원국에 재성이 뚜렷하지 않아 큰돈을 쫓기보다 기술·전문성으로 꾸준히 버는 구조입니다.'; sc=-0.6; }
    else if(weakish){ easy='재성이 있으나 일간 힘이 약해 돈 욕심이 커질수록 부담이 커지는 재다신약 구조입니다. 인성과 비겁(내 힘) 보강이 먼저입니다.'; sc=-0.4; }
    else if(bi>=3){ easy='재물 기회는 있으나 비겁이 많아 지출·경쟁·동업으로 새는 돈을 막는 것이 핵심입니다.'; sc=0; }
    else if(sik>0){ easy='식상이 재성을 생하는 구조(식상생재)가 있어 재능과 활동으로 돈을 만들기 좋고, 일간도 재를 감당할 만합니다.'; sc=1.2; }
    else { easy='재성을 감당할 힘이 있어 재물을 모으기에 무난한 구조입니다.'; sc=0.8; }
  } else if(t.id==='job'||t.id==='study'){
    var gwan=cnt[6]+cnt[7], inn=cnt[8]+cnt[9], sik2=cnt[2]+cnt[3];
    if(t.id==='study'){
      term.push('인성 위치: '+pos([8,9])+' / 식상 '+sik2+' / 학당·문창: '+(c.sinsal.filter(function(s){return ['학당귀인','문창귀인','문곡귀인','관귀학관'].indexOf(s.name)>=0;}).map(function(s){return s.name;}).join(', ')||'없음'));
      if(inn===0){ easy='원국에 인성이 약해 학업의 기반이 약하므로 운에서 인성이 들어올 때 집중하는 것이 효율적입니다.'; sc=-0.5; }
      else { easy='인성이 있어 공부와 자격 취득의 바탕이 있습니다.'+(inn>=4?' 다만 인성이 지나치면 생각만 길어질 수 있어 실행이 필요합니다.':''); sc=0.9; }
    } else {
      term.push('관성 위치: '+pos([6,7])+' / 인성 '+inn+' / 식상 '+sik2+' / 격국 '+c.gyeok.name);
      if(gwan===0){ easy='원국에 관성이 뚜렷하지 않아 조직의 틀보다 자기 재능과 독립적인 방식이 더 맞습니다.'; sc=-0.2; }
      else if(weakish&&gwan>=3){ easy='관성이 강하고 일간이 약해 직장 압박이 부담이 되기 쉬우므로 인성(후원·자격)으로 완충해야 합니다.'; sc=-0.6; }
      else { easy='관성이 있어 조직과 직위 인연이 있고, '+(inn>0?'인성이 받쳐 줘 안정적입니다.':'인성의 후원이 약해 스스로 쌓아야 합니다.'); sc=0.7; }
      try{ var cpj=careerProfile(c); easy+=' 월지·격국·용신까지 종합한 진로 방향은 '+cpj.order[0]+'·'+cpj.order[1]+' 계열이며 '+cpj.styles[0].k+'이(가) 가장 어울립니다.'; }catch(e){}
    }
  } else if(t.id==='biz'){
    var jae2=cnt[4]+cnt[5], sik3=cnt[2]+cnt[3], bi3=cnt[0]+cnt[1];
    term.push('재성 '+jae2+' / 식상 '+sik3+' / 비겁 '+bi3+' / 일간 '+st.level);
    if(jae2>0&&sik3>0&&!weakish){ easy='재성과 식상이 함께 있고 일간이 버틸 힘이 있어 사업·독립 활동에 적합한 구조입니다.'; sc=1.2; }
    else if(weakish){ easy='일간이 약해 큰 사업의 부담을 혼자 지기 어렵습니다. 규모를 작게 시작하고 동업·후원을 조심스럽게 활용하세요.'; sc=-0.6; }
    else { easy='재성이나 식상 중 한쪽이 약해 사업 구조가 완전하지 않습니다. 부족한 부분을 사람·기술로 보완해야 합니다.'; sc=0; }
  } else if(t.id==='love'){
    var sg=spouseGroup(c), sn=cnt[sg[0]]+cnt[sg[1]], iz=c.pillars[2].z;
    var rel=c.zRel.filter(function(e){ return e.a===2||e.b===2; });
    term.push('배우자성('+(c.gender==='M'?'재성':'관성')+') 위치: '+pos(sg)+' / 배우자궁 '+DZ[iz]+'('+SS[ssz(c,iz)]+') / 일지 관계: '+(rel.map(function(e){return e.type+'('+GUNG_ZI[e.a]+'-'+GUNG_ZI[e.b]+')';}).join(', ')||'없음'));
    if(sn===0){ easy='배우자성이 원국에 뚜렷하지 않아 인연이 늦거나 운에서 들어올 때 본격화됩니다.'; sc=-0.5; }
    else if(sn>=4){ easy='배우자성이 많아 이성 인연이 복잡해지기 쉬워 선택의 기준을 분명히 해야 합니다.'; sc=-0.3; }
    else { easy='배우자성이 적당히 있어 인연의 바탕은 있습니다.'; sc=0.7; }
    if(rel.some(function(e){return e.type==='충';})){ easy+=' 다만 배우자궁이 충을 받고 있어 관계의 변동성에 주의해야 합니다.'; sc-=0.6; }
    if(rel.some(function(e){return e.type==='육합';})){ easy+=' 배우자궁이 합을 이루어 인연이 단단히 묶이는 힘이 있습니다.'; sc+=0.4; }
  } else if(t.id==='health'){
    var tot=c.strength.E.reduce(function(a,b){return a+b;},0), low=0, high=0;
    c.strength.E.forEach(function(v,i){ if(v<c.strength.E[low]) low=i; if(v>c.strength.E[high]) high=i; });
    term.push('오행 분포(가중): '+c.strength.E.map(function(v,i){return WXH[i]+v.toFixed(1);}).join(' ')+' / 최약 '+WXH[low]+' / 최강 '+WXH[high]);
    easy='오행으로 보면 '+WX_INFO[low].n+' 기운이 가장 약해 '+WX_INFO[low].body+' 쪽을 챙기는 것이 좋고, '+WX_INFO[high].n+' 기운이 가장 강해 '+WX_INFO[high].over.replace(/이 필요합니다\.$/,'을 살펴야 합니다.');
    var bad=c.zRel.filter(function(e){ return ['충','형','삼형'].indexOf(e.type)>=0; });
    if(bad.length){ easy+=' 원국 안의 '+bad.map(function(e){return e.type; }).filter(function(v,i,a){return a.indexOf(v)===i;}).join('·')+'은 해당 궁의 장부·관절이 약해지기 쉬운 지점입니다.'; sc-=0.5; }
  } else if(t.id==='move'){
    var yeok=c.sinsal.filter(function(s){return s.name==='역마살';});
    var chg=c.zRel.filter(function(e){return e.type==='충';});
    term.push('역마: '+(yeok.length?yeok[0].where.join(', '):'없음')+' / 원국 충: '+(chg.length?chg.map(function(e){return GUNG_ZI[e.a]+'-'+GUNG_ZI[e.b];}).join(', '):'없음'));

/* 운의 주제 적합 점수 */
function topicLuckScore(c,t,r){
  var keys=keyList(c,t), sc=r.score;
  var roleAvg=(ROLE_SCORE[r.roleG]+ROLE_SCORE[r.roleZ])/2;
  if(keys.length){
    var hit=(keys.indexOf(r.ssg)>=0)+(keys.indexOf(r.ssz)>=0);
    if(hit) sc+= (roleAvg>=0?1.0:-0.5)*hit*0.7;
  }
  if(t.sub&&t.sub.length){ var h2=(t.sub.indexOf(r.ssg)>=0)+(t.sub.indexOf(r.ssz)>=0); if(h2) sc+=0.25*h2; }
  if(t.id==='love'){
    var iz=c.pillars[2].z;
    r.rel.forEach(function(e){ if(e.gung===2){ if(e.type==='육합') sc+=0.8; if(e.type==='충'||e.type==='형') sc-=0.6; } });
  }
  if(t.id==='health'){
    if([6,7,8,9].indexOf(r.un)>=0) sc-=0.6;
    r.rel.forEach(function(e){ if((e.gung===2||e.gung===1)&&['충','형'].indexOf(e.type)>=0) sc-=0.4; });
    if(r.tags.indexOf('양인')>=0||r.tags.indexOf('백호')>=0) sc-=0.4;
  }
  if(t.id==='move'){
    r.rel.forEach(function(e){ if(e.type==='충') sc+=0.0; });
  }
  return sc;
}
function gradeOfScore(s){ return s>=2.6?'대길':s>=1.0?'길':s>-1.0?'소길':s>-2.6?'평':'소흉'; }
function pickYear(q,sy){
  var m=q.match(/(20\d\d|19\d\d)/); if(m) return +m[1];
  if(q.indexOf('내후년')>=0) return sy+2;
  if(q.indexOf('내년')>=0) return sy+1;
  if(q.indexOf('작년')>=0) return sy-1;
  return sy;
}

  function fresh(p){ if(!p) return ''; if(CHAT_SEEN[p]) return ''; return p; }
  var more=[sents[2],sents[3]].filter(function(x){return x&&x.length<=110;});
  var yrs=''; try{ var by=bestYearsFor(c,t.id,nowJD,Math.max(1,ageAt(c,nowJD)|0),90,3); if(by.length) yrs='앞으로 이 분야의 흐름이 특히 좋은 해는 '+by.map(function(b){return b.y+'년('+b.age+'세)';}).join(', ')+'입니다.'; }catch(e){}

function deepAnswer(c,q,nowJD){
  var t=topicOf(q), nc=nowCtx(c,nowJD), year=pickYear(q,nc.sy), keys=keyList(c,t);
  var nat=natalTopic(c,t);
  var rD=nc.rDW, dLab=nc.dw?fz(nc.dw.idx)+' 대운':'대운 시작 전';
  var aD=rD?luckAnalysis(c,nc.dw.idx,'대운','대운'):null;
  var aY=luckAnalysis(c,seunIdx(year),'세운','세운');
  var scD=rD?topicLuckScore(c,t,rD):0, scY=topicLuckScore(c,t,aY.r);
  var wl=wolunList(year), mon=[];
  wl.forEach(function(m){
    var r=evalLuck(c,c,m.idx,'월운'); var s=topicLuckScore(c,t,r);
    mon.push({m:m,r:r,s:s,g:gradeOfScore(s*1.2),hit:keys.length&&hasKey(r,keys)});
  });
  var scM=mon.reduce(function(a,b){return a+b.s;},0)/12;
  var total=nat.score*0.8+scD*0.3+scY*0.35+scM*0.2;
  var verdict=gradeOfScore(total*1.4);
  var best=mon.slice().sort(function(a,b){return b.s-a.s;}).slice(0,2).sort(function(a,b){return a.m.i-b.m.i;});
  var worst=mon.slice().sort(function(a,b){return a.s-b.s;}).slice(0,2).sort(function(a,b){return a.m.i-b.m.i;});
  /* 길한 점 / 흉한 점 */
  var goods=[], bads=[];
  if(nat.score>=0.5) goods.push('원국 바탕: '+nat.txt.split('. ')[0].replace(/\.$/,'')+'.'); else if(nat.score<=-0.3) bads.push('원국 바탕: '+nat.txt.split('. ')[0].replace(/\.$/,'')+'.');
  [['대운',rD,scD,dLab],['세운',aY.r,scY,year+'년 '+fz(seunIdx(year))]].forEach(function(x){
    if(!x[1]) return;
    var rr=x[1];
    if(x[2]>=1.0) goods.push(x[0]+'('+x[3]+')이 '+(hasKey(rr,keys)?t.domain+'과 직접 연결된 십성('+SS[rr.ssg]+'/'+SS[rr.ssz]+')을 가져와 ':'도움이 되는 오행('+rr.roleG+'/'+rr.roleZ+')으로 ')+'힘을 보태 줍니다.');
    if(x[2]<=-1.0){ bads.push(x[0]+'('+x[3]+')은 '+(rr.rel.filter(function(e){return BAD_REL.indexOf(e.type)>=0;}).length?'원국과의 '+rr.rel.filter(function(e){return BAD_REL.indexOf(e.type)>=0;}).map(function(e){return e.type;}).filter(function(v,i,a){return a.indexOf(v)===i;}).join('·')+'이 겹쳐 ':'기신 계열 오행이 들어와 ')+'부담이 커집니다.'); }
  });
  if(best.length) goods.push('월운에서 비교적 유리한 달: '+best.map(function(b){return b.m.solarMonth+'월('+hz(b.m.idx)+')';}).join(', '));
  if(worst.length && worst[0].s<=-0.8) bads.push('월운에서 조심할 달: '+worst.map(function(b){return b.m.solarMonth+'월('+hz(b.m.idx)+')';}).join(', '));
  if(!goods.length) goods.push('두드러진 호재는 없지만 큰 방해 요소도 적어 꾸준함이 힘이 됩니다.');
  if(!bads.length) bads.push('뚜렷한 흉 요인은 크지 않으나 월별 변동은 점검하세요.');
  return {topic:t,year:year,nat:nat,aD:aD,aY:aY,mon:mon,dLab:dLab,scD:scD,scY:scY,scM:scM,total:total,verdict:verdict,best:best,worst:worst,goods:goods,bads:bads,nc:nc,keys:keys};
}

function fixJosa(str){
  if(typeof str!=='string') return str;
  str=str.replace(/(\([가-힣]+\))(으로|은|는|이|가|을|를|과|와|로)(?![가-힣(])/g,function(m,w,p){ return w+pickParticle(p,batchimOf(w.charAt(w.length-2))); });
  str=str.replace(RE_TOKEN,function(m,w,tag,p){
    var b=batchimOf(w.charAt(w.length-1));
    return w+(tag||'')+pickParticle(p,b);
  });
  str=str.replace(/(을\(를\)|를\(을\)|이\(가\)|가\(이\)|은\(는\)|는\(은\)|과\(와\)|와\(과\)|\(으\)로|으로\(로\)|\(이\)라|이라\(라\)|이\(라\))/g,function(m,p,off,all){
    var b=batchimOf(lastSylAt(all,off));
    if(b<0) return m;
    var has=b>0;
    if(/^[을를]/.test(m)) return has?'을':'를';
    if(/^[이가]\(/.test(m)&&m!=='이(라)') return has?'이':'가';
    if(/^[은는]/.test(m)) return has?'은':'는';
    if(/^[과와]/.test(m)) return has?'과':'와';
    if(m==='(으)로'||m==='으로(로)') return (has&&b!==8)?'으로':'로';
    if(m==='(이)라'||m==='이라(라)'||m==='이(라)') return has?'이라':'라';
    return m;
  });
  return str;
}

function dedupHtml(s){
  if(!s) return s;
  s=s.replace(/<li>([\s\S]*?)<\/li>/g,function(m,inner){ var k=inner.replace(/<[^>]*>/g,'').replace(/\s+/g,'').replace(/[()·,]/g,''); if(k.length<22) return m; if(_seen['li:'+k]) return ''; _seen['li:'+k]=1; return m; }).replace(/<ul>\s*<\/ul>/g,'');
  var parts=s.split(/(?<=[.!?])(?=\s|<br>|$)/);
  return parts.map(function(p){
    var m=p.match(/^((?:\s|<(?:\/?(?:li|ul|div|br|h\d|p)[^>]*)>)*)([\s\S]*?)((?:\s|<(?:\/?(?:li|ul|div|br|h\d|p)[^>]*)>)*)$/);
    var pre=m?m[1]:'', core=m?m[2]:p, suf=m?m[3]:'';
    if(/<\/?(li|ul|div|table|tr|td|h\d)/.test(core)) return p;
    var k=core.replace(/<[^>]*>/g,'').replace(/\s+/g,'').replace(/[()·,]/g,'');

    _seen[k]=1; return p;
  }).join('').replace(/<li>\s*<\/li>/g,'').replace(/<ul>\s*<\/ul>/g,'').replace(/(<br>\s*){3,}/g,'<br><br>').replace(/^(\s|<br>)+/,'');

function toggleMenu(open){ $('pdfPanel').hidden=!open; $('btnPdf').setAttribute('aria-expanded',open?'true':'false'); }

/* ---- 이야기책 ---- */
function buildBookPages(book){
  var stage=$('stage'); stage.innerHTML=''; var pages=[];
  var c=STATE.chart, P=c.pillars, i=c.input;
  var cover=document.createElement('div'); cover.className='bk cover';
  var labs=['연주','월주','일주','시주'];
  cover.innerHTML='<div class="ct"><div class="kick">SAJU STORY</div><h1>'+esc(book.title)+'</h1><div class="sub">'+esc(book.sub)+'<br>'+esc(i.place)+' 출생 · '+(c.gender==='M'?'남':'여')+'</div><div class="pl">'
    +[3,2,1,0].map(function(k){ var p=P[k]; return '<div><small>'+labs[k]+'</small>'+TG[p.g]+'<br>'+DZ[p.z]+'</div>'; }).join('')+'</div></div><div class="ft">만세력 사주 상담</div>';
  stage.appendChild(cover); pages.push(cover);
  function newPage(h,cont){
    var d=document.createElement('div'); d.className='bk';
    var inn=document.createElement('div'); inn.className='in'; d.appendChild(inn);
    if(h){ var e=document.createElement('h2'); if(cont) e.className='cont'; e.textContent=h; inn.appendChild(e); }
    stage.appendChild(d); pages.push(d); return inn;
  }
  function over(inn){ return inn.scrollHeight>inn.clientHeight+1; }
  book.chapters.forEach(function(ch){
    var inn=newPage(ch.h,false);
    ch.p.forEach(function(txt){
      var p=document.createElement('p'); p.textContent=txt; inn.appendChild(p);
      if(!over(inn)) return;
      inn.removeChild(p);
      var sents=txt.split(/(?<=[.!?”"])\s+/), cur=document.createElement('p'); inn.appendChild(cur);
      sents.forEach(function(s){
        var prev=cur.textContent; cur.textContent=prev?prev+' '+s:s;
        if(over(inn)){
          cur.textContent=prev;
          if(!prev) inn.removeChild(cur);
          inn=newPage(ch.h+' · 이어서',true);
          cur=document.createElement('p'); cur.textContent=s; inn.appendChild(cur);
        }
      });
    });
  });
  pages.forEach(function(pg,k){ if(k>0){ var n=document.createElement('div'); n.className='pn'; n.textContent=k; pg.appendChild(n); } });
  return pages;
}
async function makeBookPDF(){
  if(PDF.busy) return;
  if(!pdfReady()){ openBusy('PDF 도구를 불러오지 못했습니다.'); endBusy('PDF 도구를 불러오지 못했습니다. 네트워크 연결을 확인하고 페이지를 새로 열어 주세요.',true); return; }
  PDF.busy=true; openBusy('이야기책을 쓰는 중입니다…');
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    var book=storyBook(STATE.chart,STATE.nowJD);
    var pages=buildBookPages(book);
    var doc=new window.jspdf.jsPDF({unit:'mm',format:[148,210],orientation:'portrait',compress:true}), imgs=[];
    for(var k=0;k<pages.length;k++){
      setBusy('이야기책 페이지를 만드는 중… '+(k+1)+' / '+pages.length,(k+1)/pages.length);
      var cv=await window.html2canvas(pages[k],{scale:1.6,backgroundColor:'#ffffff',logging:false});
      if(k>0) doc.addPage([148,210],'portrait');
      var du=cv.toDataURL('image/jpeg',0.82); imgs.push(du);
      doc.addImage(du,'JPEG',0,0,148,210);
      await tick(10);
    }
    window.__bookPages=pages.length; window.__bookChars=bookChars(book);
    showPreview(doc,safeName()+'_사주이야기책.pdf',imgs,'사주 이야기책');
  }catch(e){ endBusy('이야기책을 만들지 못했습니다: '+(e&&e.message||e),true); }
  finally{ $('stage').innerHTML=''; PDF.busy=false; }
}
/* ---- 분석 결과 ---- */
function PageFlow(doc){
  /* A4 = 1240x1754px, 여백 59px. 조각을 페이지 캔버스에 쌓고 가득 차면 PDF 페이지로 확정 */
  this.doc=doc; this.W=1240; this.H=1754; this.M=59; this.imgs=[]; this.first=true; this.newPage();
}
PageFlow.prototype.newPage=function(){
  this.cv=document.createElement('canvas'); this.cv.width=this.W; this.cv.height=this.H;
  this.cx=this.cv.getContext('2d'); this.cx.fillStyle='#ffffff'; this.cx.fillRect(0,0,this.W,this.H); this.y=this.M;
};
PageFlow.prototype.flush=function(){
  var du=this.cv.toDataURL('image/jpeg',0.85); this.imgs.push(du);
  if(!this.first) this.doc.addPage('a4','portrait'); this.first=false;
  this.doc.addImage(du,'JPEG',0,0,210,297);
};
PageFlow.prototype.add=function(src){
  var w=this.W-2*this.M, sc=w/src.width, drawn=0;
  while(drawn<src.height){
    var avail=this.H-this.M-this.y;
    if(avail<120){ this.flush(); this.newPage(); avail=this.H-2*this.M; }
    var sh=Math.min(src.height-drawn,Math.floor(avail/sc));
    this.cx.drawImage(src,0,drawn,src.width,sh,this.M,this.y,w,sh*sc);
    this.y+=sh*sc+14; drawn+=sh;
    if(drawn<src.height){ this.flush(); this.newPage(); }
  }
};
PageFlow.prototype.end=function(){ this.flush(); return this.imgs; };
async function makeReportPDF(){
  if(PDF.busy) return;
  if(!pdfReady()){ openBusy('PDF 도구를 불러오지 못했습니다.'); endBusy('PDF 도구를 불러오지 못했습니다. 네트워크 연결을 확인하고 페이지를 새로 열어 주세요.',true); return; }
  PDF.busy=true; openBusy('분석 결과를 정리하는 중입니다…');
  var host=$('rstage'); host.innerHTML='';
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    var c=STATE.chart, i=c.input, nd=jdToKST(STATE.nowJD);
    var box=document.createElement('div'); box.className='lightscope pdfmode'; box.style.width='780px';
    var head=document.createElement('div'); head.className='pdfhead';
    head.innerHTML='<h1>'+esc(i.name)+'님의 사주 분석</h1><p>양력 '+i.y+'.'+p2(i.m)+'.'+p2(i.d)+' '+p2(i.h)+':'+p2(i.mi)+' · '+(c.gender==='M'?'남':'여')+' · '+esc(i.place)+' · 분석 기준일 '+nd.y+'.'+p2(nd.m)+'.'+p2(nd.d)+'</p>';
    box.appendChild(head);
    var parts=[head];
    Array.prototype.forEach.call($('report').querySelectorAll('section.sec'),function(s){
      if(s.id==='s-q') return;
      var cl=s.cloneNode(true);
      Array.prototype.forEach.call(cl.querySelectorAll('details'),function(d){ d.setAttribute('open',''); });
      box.appendChild(cl); parts.push(cl);
    });
    host.appendChild(box);
    await tick(120);
    var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    var pf=new PageFlow(doc);
    for(var k=0;k<parts.length;k++){
      setBusy('분석 결과를 PDF로 만드는 중… '+(k+1)+' / '+parts.length,(k+1)/parts.length);
      var cv=await window.html2canvas(parts[k],{scale:1.5,backgroundColor:'#ffffff',logging:false,windowWidth:780});
      pf.add(cv);
      await tick(10);
    }
    window.__reportParts=parts.length;
    var imgs=pf.end();
    showPreview(doc,safeName()+'_사주분석.pdf',imgs,'사주 분석 결과');
  }catch(e){ endBusy('분석 결과 PDF를 만들지 못했습니다: '+(e&&e.message||e),true); }
  finally{ host.innerHTML=''; PDF.busy=false; }
}
